<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

    <link rel="stylesheet" href="assets/css/style.css">
    <title>Dear Son Motivational Quotes</title>
</head>
<body>
    <header class="bg-primary text-white text-center py-4">
        <h1 class="">Dear Son Motivational Quotes</h1>
        <p class="lead">Get inspired: Seeing is believing</p>
    </header>

    <section>
        <!-- Bootstrap Carousel -->
        <div id="quoteCarouselDiv" class="carousel slide" data-ride="carousel">
            <div class="carousel-inner" id="carouselItems">
                <!-- Cards will be dynamically inserted here -->
            </div>
           
        </div>

         <!-- Controls for carousel -->
         <a class="carousel-control-prev" href="#quoteCarouselDiv" role="button" data-slide="prev">
          <span class="carousel-control-prev-icon" aria-hidden="true"></span>
          <span class="sr-only">Previous</span>
        </a>
        <a class="carousel-control-next" href="#quoteCarouselDiv" role="button" data-slide="next">
          <span class="carousel-control-next-icon" aria-hidden="true"></span>
          <span class="sr-only">Next</span>
        </a>
    </section>

    <footer class="bg-dark text-white py-4">
        <div class="container text-center">
          <!-- Social Media Icons -->
          <div class="my-3">
            <a href="https://x.com/11pids" target="_blank" class="text-white mx-2" aria-label="Twitter">
              <i class="fab fa-twitter fa-lg"></i>
            </a>
            <a href="https://github.com/11pids" target="_blank" class="text-white mx-2" aria-label="GitHub">
              <i class="fab fa-github fa-lg"></i>
            </a>
          </div>
      
          <!-- Copyright Section -->
          <div class="copyright container" id="copyrightDiv">
          </div>
          
        </div>
    </footer>
      
      <!-- Include Font Awesome for icons -->
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.4/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <script src="assets/js/script.js"></script>
</body>
</html>
